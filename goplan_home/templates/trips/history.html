{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPlan · Trip history</title>
  <link rel="stylesheet" href="{% static 'css/app_shell.css' %}">
  <style>
    :root{--ink:#18263d;--muted:#718096;--line:#e4eaf3;--blue:#2563eb}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f6f9ff,#edf5ff);font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--ink)}
    main{margin-left:246px;padding:90px 6vw 50px;max-width:1100px}.back{display:inline-flex;gap:8px;align-items:center;color:#52637c;text-decoration:none;font-size:13px;font-weight:700;margin-bottom:28px}
    .eyebrow{color:var(--blue);font-size:11px;letter-spacing:1.8px;font-weight:900}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.hero h1{font-size:clamp(30px,4vw,48px);margin:8px 0}.hero p{color:var(--muted);margin:0}.clear{border:1px solid #f0c8cf;background:#fff5f6;color:#be4051;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
    .history-list{display:grid;gap:13px}.trip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:10px;box-shadow:0 12px 30px #2d4f8410}.trip h3{margin:0 0 5px;font-size:16px}.trip p,.trip small{margin:0;color:var(--muted);font-size:12px}.trip-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#52637c;font-size:11px}.empty{padding:40px;border:1px dashed #cbd8eb;border-radius:18px;text-align:center;color:var(--muted);background:#ffffffaa}
    @media(max-width:900px){main{margin-left:0;padding:86px 18px 40px}.hero{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
{% include "includes/app_sidebar.html" %}
<main>
  <a class="back" href="{{ request.META.HTTP_REFERER|default:'/' }}">← Back</a>
  <div class="hero"><div><div class="eyebrow">YOUR JOURNEYS</div><h1>Trip history</h1><p>Routes you have planned in GoPlan, kept in Django.</p></div><button class="clear" id="clearHistory">Clear history</button></div>
  <section class="history-list" id="historyList"><div class="empty">Loading your trips…</div></section>
</main>
<script>
const list=document.getElementById('historyList');
function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
async function loadTrips(){const r=await fetch('/api/trips/');const d=await r.json();if(!d.trips?.length){list.innerHTML='<div class="empty">No saved trips yet. Plan a route on Intelligent Map and it will appear here.</div>';return}list.innerHTML=d.trips.map(t=>`<article class="trip"><div><h3>${esc(t.title)}</h3><p>${esc(t.origin||'Current location')} → ${esc(t.destination)}</p><div class="trip-meta"><span>🚗 ${esc(t.mode)}</span><span>${t.distance_km??'—'} km</span><span>${t.duration_minutes??'—'} min</span><span>${new Date(t.created_at).toLocaleString()}</span></div></div><button class="clear" onclick="removeTrip(${t.id})">Remove</button></article>`).join('')}
async function removeTrip(id){await fetch('/api/trips/'+id+'/',{method:'DELETE',headers:{'X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''}});loadTrips()}
document.getElementById('clearHistory').onclick=async()=>{if(confirm('Clear all saved trips from this browser?')){await fetch('/api/trips/clear/',{method:'DELETE',headers:{'X-CSRFToken':document.cookie.match(/csrftoken=([^;]+)/)?.[1]||''}});loadTrips()}}
loadTrips();
</script>
</body></html>
